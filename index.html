<style>
  :root{
    --bg:#080a0e;
    --bg2:#0c0f15;
    --panel:#10141c;
    --panel2:#141925;
    --line:#1d2633;
    --line2:#2a3647;
    --cyan:#36e3d1;
    --cyan-dim:#1c8d83;
    --red:#ff3b4e;
    --red-dim:#7a1f29;
    --amber:#ffb454;
    --green:#4ade80;
    --text:#cdd6de;
    --muted:#74828f;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Noto Sans TC',system-ui,sans-serif;
    --serif:'Noto Serif TC',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    position:relative;
  }
  /* atmospheric layers */
  #net{position:fixed;inset:0;z-index:0;display:block}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 0%,transparent 40%,rgba(0,0,0,.55) 100%);}
  .scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
  .grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  .wrap{position:relative;z-index:3;height:100vh;height:100dvh;display:flex;flex-direction:column}

  /* top status bar */
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(16,20,28,.92),rgba(8,10,14,.6));
    backdrop-filter:blur(6px);font-family:var(--mono);font-size:12px;letter-spacing:.05em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .codename{color:var(--cyan);font-weight:600}
  .topbar .sep{color:var(--line2)}
  .topbar .muted{color:var(--muted)}
  .topbar .spacer{flex:1}
  .langbtn{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    color:var(--cyan);background:transparent;border:1px solid var(--cyan-dim);padding:4px 10px;
    transition:background .15s}
  .langbtn:hover{background:rgba(54,227,209,.08)}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}

  .card{width:min(760px,100%);}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--cyan);text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--cyan)}

  h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,64px);line-height:1.08;letter-spacing:.02em;color:#f2f6f8}
  .sub{margin-top:18px;color:var(--muted);font-size:15px;line-height:1.8;max-width:54ch}
  .brief{margin-top:26px;border:1px solid var(--line);background:var(--panel);padding:18px 20px;font-size:14px;line-height:1.9}
  .brief .row{display:flex;gap:14px;font-family:var(--mono);font-size:12.5px}
  .brief .k{color:var(--cyan-dim);min-width:84px;letter-spacing:.1em}
  .brief .v{color:var(--text)}

  .btn{margin-top:30px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;
    font-family:var(--mono);font-size:14px;letter-spacing:.12em;color:var(--bg);
    background:var(--cyan);border:0;padding:15px 26px;font-weight:600;
    transition:transform .12s ease, box-shadow .2s ease, background .2s;text-transform:uppercase}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(54,227,209,.3)}
  .btn .arr{transition:transform .2s}
  .btn:hover .arr{transform:translateX(4px)}
  .btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan-dim)}
  .btn.ghost:hover{box-shadow:none;background:rgba(54,227,209,.08)}

  /* round play */
  .roundtag{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted)}
  .roundtag b{color:var(--cyan)}
  .prompt{font-family:var(--serif);font-weight:700;font-size:clamp(20px,3vw,28px);line-height:1.45;margin:14px 0 6px;color:#eef3f5}
  .technique{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:20px;opacity:.9}
  .technique::before{content:"// 手法："}
  html[lang="en"] .technique::before{content:"// TACTIC: "}

  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{text-align:left;cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:16px 18px;color:var(--text);font-size:15px;line-height:1.55;font-family:var(--sans);
    display:flex;gap:14px;align-items:flex-start;transition:border-color .15s, transform .12s, background .15s}
  .opt:hover{border-color:var(--cyan-dim);transform:translateX(3px)}
  .opt:active{transform:scale(.992)}
  .btn:active{transform:translateY(0)}
  .opt .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:3px 7px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;margin-top:1px}
  .opt[data-h="3"]:hover,.opt[data-h="4"]:hover{border-color:var(--red);}
  .opt[data-h="1"] .tag{color:var(--muted)}
  .opt[data-h="2"] .tag{color:var(--amber);border-color:#5a4420}
  .opt[data-h="3"] .tag,.opt[data-h="4"] .tag{color:var(--red);border-color:var(--red-dim)}
  .opt.disabled{pointer-events:none;opacity:.25}

  /* metrics dock */
  .dock{display:flex;gap:0;border-top:1px solid var(--line);background:rgba(10,13,18,.85);backdrop-filter:blur(6px)}
  .metric{flex:1;padding:14px 18px;border-right:1px solid var(--line)}
  .metric:last-child{border-right:0}
  .metric .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .metric .val{font-family:var(--mono);font-weight:600;font-size:24px;margin-top:4px;color:var(--text);font-variant-numeric:tabular-nums}
  .metric.spread .val{color:var(--cyan)}
  .metric.panic .val{color:var(--red)}
  .bar{position:relative;height:6px;background:var(--line);margin-top:9px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--green);transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .bar .thresh{position:absolute;top:0;bottom:0;left:70%;width:1px;background:var(--amber);opacity:.85;z-index:2}
  .metric.favor .val{color:var(--cyan)}
  /* result panel + share UX */
  .result .resline{font-family:var(--serif);font-weight:700;font-size:clamp(19px,2.6vw,24px);line-height:1.5;color:#eef3f5;margin:8px 0 22px}
  .deltas{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
  .deltas > div{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:13px 16px}
  .deltas .dl{font-size:13.5px;color:var(--text)}
  .deltas .dv{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--red)}
  .deltas .dl.block b{color:var(--green)}
  .deltas .dv.block{color:var(--green)}
  .chart{margin:4px 0 16px;border:1px solid var(--line);background:var(--bg2);padding:12px 12px 8px}
  .chart svg{width:100%;height:96px;display:block}
  .chart .axis{stroke:var(--line2);stroke-width:1}
  .chart .checkline{stroke:var(--cyan-dim);stroke-width:1;stroke-dasharray:3 3;opacity:.55}
  .chart #cline{fill:none;stroke:var(--red);stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,59,78,.4))}
  .chart #chead{fill:#fff}
  .chartlabels{display:flex;justify-content:space-between;align-items:center;margin-top:6px;min-height:16px}
  .ctimer{font-family:var(--mono);font-size:11.5px;color:var(--amber)}
  .ctimer b{color:var(--red)}
  .cdone{font-family:var(--mono);font-size:11.5px;color:var(--green);opacity:0;transition:opacity .3s}
  .cdone.show{opacity:1}
  .checkline-note{font-size:13px;color:var(--green);line-height:1.6;margin-top:14px}
  .checkline-note::before{content:"▸ ";color:var(--green)}
  .backfire{border:1px solid var(--red-dim);background:rgba(122,31,41,.14);padding:14px 16px;margin-top:16px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
  .backfire.show{opacity:1;transform:none}
  .backfire .bf-h{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--red);margin-bottom:6px}
  .backfire p{font-size:13.5px;line-height:1.65;color:var(--text)}
  .backfire .bf-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--red-dim);font-size:13px;color:var(--green)}
  .backfire .bf-row b{font-family:var(--mono);color:var(--green)}
  .opt.picked{border-color:var(--cyan)}
  .btn.share{margin-top:26px;background:var(--cyan)}
  .linklike{cursor:pointer;color:var(--cyan)}
  .linklike:hover{text-decoration:underline}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);color:var(--text);font-family:var(--mono);font-size:12.5px;padding:11px 18px;opacity:0;transition:opacity .3s,transform .3s;z-index:7;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .flash{position:fixed;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--cyan);
    pointer-events:none;z-index:6;text-shadow:0 0 12px rgba(54,227,209,.6);opacity:0}
  .flash.r{color:var(--red);text-shadow:0 0 12px rgba(255,59,78,.6)}

  /* success / reveal full screens */
  .full{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-start;justify-content:center;
    padding:28px;padding-bottom:max(28px,env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    opacity:0;pointer-events:none;transition:opacity .6s}
  .full > div{margin:auto 0}
  .full.show{opacity:1;pointer-events:auto}
  .success-bg{background:radial-gradient(80% 60% at 50% 50%,rgba(122,31,41,.35),rgba(8,10,14,.96))}
  .reveal-bg{background:#070809}

  .stamp{font-family:var(--mono);letter-spacing:.3em;font-size:13px;color:var(--red);text-transform:uppercase}
  .bigwin{font-family:var(--serif);font-weight:900;font-size:clamp(40px,8vw,84px);color:#fff;line-height:1.1;margin:14px 0;letter-spacing:.04em}
  .winline{color:var(--muted);font-size:15px;line-height:1.8;max-width:46ch}

  /* reveal table */
  .reveal-card{width:min(820px,100%)}
  .gut{font-family:var(--serif);font-weight:900;font-size:clamp(24px,4vw,40px);line-height:1.4;color:#f2f6f8}
  .gut .hl{color:var(--cyan)}
  .deb{margin-top:28px;display:flex;flex-direction:column;gap:1px;background:var(--line)}
  .deb .head,.deb .r{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:1px}
  .deb .head span{background:var(--bg2);padding:10px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .deb .r > div{background:var(--panel);padding:14px 14px;font-size:13.5px;line-height:1.6}
  .deb .r .m{color:var(--red);font-family:var(--mono);font-size:12.5px}
  .deb .r .t{color:var(--text)}
  .deb .r .s{color:var(--green)}
  .deb .r .s::before{content:"▸ ";color:var(--green)}
  .endmeta{margin-top:26px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:16px}
  .reveal-stagger > *{opacity:0;transform:translateY(14px);animation:rise .7s forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- responsive ---------- */
  @media(max-width:900px){
    .stage{padding:20px}
  }
  @media(max-width:620px){
    .stage{padding:16px 14px;align-items:flex-start}
    .sub{font-size:14px}
    .brief{padding:14px 15px}
    .opt{font-size:14px;padding:14px;gap:10px}
    .prompt{font-size:20px}
    /* dock: keep 3-up, compact instead of wrapping */
    .metric{padding:10px}
    .metric .lab{font-size:9px;letter-spacing:.04em}
    .metric .val{font-size:17px}
    .bar{margin-top:7px;height:5px}
    /* reveal table -> stacked, labelled cards (keep column meaning) */
    .deb{gap:10px;background:transparent}
    .deb .head{display:none}
    .deb .r{grid-template-columns:1fr;gap:0;border:1px solid var(--line)}
    .deb .r > div{padding:12px 14px}
    .deb .r .m{border-bottom:1px solid var(--line)}
    .deb .r .m::before{content:"手法";display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
    .deb .r .t::before{content:"現實真相";display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
    html[lang="en"] .deb .r .m::before{content:"TACTIC"}
    html[lang="en"] .deb .r .t::before{content:"IN REALITY"}
    .deb .r .s{background:var(--panel2)}
    .deb .r .s::before{content:"盾牌 ▸ ";color:var(--green);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
    html[lang="en"] .deb .r .s::before{content:"SHIELD ▸ "}
    .endmeta{font-size:11px}
    .topbar{font-size:11px;gap:8px;flex-wrap:wrap}
  }
  @media(max-width:480px){
    .topbar > span:nth-child(4),.topbar > span:nth-child(5){display:none} /* hide node-count meta */
    .topbar > span:last-child{display:none} /* hide version meta */
    h1{font-size:38px}
  }
  @media(prefers-reduced-motion:reduce){
    .dot{animation:none}
    .reveal-stagger > *{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
  <canvas id="net" aria-hidden="true"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="scan"></div>

  <div class="wrap">
    <div class="topbar">
      <span class="dot"></span>
      <span class="codename" id="t-codename"></span>
      <span class="sep">|</span>
      <span class="muted"><span id="t-nodes-label"></span> <b id="t-nodes" style="color:var(--text)">— —</b></span>
      <span class="sep">|</span>
      <span class="muted"><span id="t-stage-label"></span> <b id="t-stage" style="color:var(--text)"></b></span>
      <span class="spacer"></span>
      <button class="langbtn" id="mutebtn" type="button" aria-label="Toggle sound">♪ ON</button>
      <button class="langbtn" id="langbtn" type="button" aria-label="Switch language"></button>
      <span class="muted" id="t-version"></span>
    </div>

    <div class="stage" id="stage"></div>

    <div class="dock" id="dock" style="display:none">
      <div class="metric favor">
        <div class="lab" id="lab-favor"></div>
        <div class="val"><span id="m-favor">0</span><span style="font-size:14px;color:var(--muted)">%</span></div>
        <div class="bar"><span class="thresh"></span><i id="bar-favor" style="width:0%"></i></div>
      </div>
      <div class="metric spread">
        <div class="lab" id="lab-spread"></div>
        <div class="val" id="m-spread">0</div>
      </div>
      <div class="metric panic">
        <div class="lab" id="lab-panic"></div>
        <div class="val"><span id="m-panic">0</span></div>
        <div class="bar"><i id="bar-panic" style="width:0%;background:var(--red)"></i></div>
      </div>
    </div>
  </div>

  <!-- success -->
  <div class="full success-bg" id="screen-success">
    <div class="card" style="text-align:center">
      <div class="stamp" id="win-stamp">▌ MISSION COMPLETE</div>
      <div class="bigwin" id="win-title"></div>
      <p class="winline" id="win-line" style="margin:0 auto"></p>
      <button class="btn ghost" id="to-reveal" style="margin-top:34px"></button>
    </div>
  </div>

  <!-- reveal -->
  <div class="full reveal-bg" id="screen-reveal">
    <div class="reveal-card reveal-stagger">
      <div class="eyebrow" id="rv-eyebrow" style="animation-delay:.05s"></div>
      <p class="gut" id="rv-gut" style="animation-delay:.2s"></p>

      if(!AC) return false;

        ac = new AC();

      src.connect(f);

  }

  /* ---------- network canvas ---------- */
  const cv = $("#net"), cx = cv.getContext("2d");
  let W,H, nodes=[], edges=[], pulses=[], intensity=0;
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; build(); }
  function build(){
    const small = W<620;
    const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let count = Math.min(small?80:150, Math.max(small?32:60, Math.floor(W*H/14000)));
    if(rm) count = Math.min(count, 36);
    nodes = [];
    for(let i=0;i<count;i++){
      nodes.push({x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,
        a:0, base:0.06+Math.random()*0.06});
    }
    edges=[];
    for(let i=0;i<nodes.length;i++){
      let cand=[];
      for(let j=0;j<nodes.length;j++) if(i!==j){
        const d=(nodes[i].x-nodes[j].x)**2+(nodes[i].y-nodes[j].y)**2;
        cand.push([d,j]);
      }
      cand.sort((a,b)=>a[0]-b[0]);
      for(let k=0;k<2;k++) if(cand[k]) edges.push([i,cand[k][1]]);
    }
    $("#t-nodes").textContent = nodes.length;
  }
  function ignite(strength){
    SFX.igniteBurst(strength);
    intensity = Math.min(1, intensity + strength*0.18);
    const seeds = Math.floor(strength*strength*2)+2;
    for(let s=0;s<seeds;s++){
      const n = nodes[Math.floor(Math.random()*nodes.length)];
      if(n){ n.a = 1; spread_from(n, strength); }
    }
  }
  function spread_from(origin, strength){
    let near = nodes.map((n,idx)=>[(origin.x-n.x)**2+(origin.y-n.y)**2,idx])
                    .sort((a,b)=>a[0]-b[0]).slice(1, 2+strength*2);
    near.forEach(([_,idx])=>{
      pulses.push({fx:origin.x,fy:origin.y,tx:nodes[idx].x,ty:nodes[idx].y,t:0,
        spd:0.012+Math.random()*0.02, idx});
    });
  }
  function loop(){
    cx.clearRect(0,0,W,H);
    intensity *= 0.992;
    SFX.ambient(intensity);
    cx.lineWidth=1;
    for(const [a,b] of edges){
      const n1=nodes[a],n2=nodes[b];
      const lit=(n1.a+n2.a)/2;
      cx.strokeStyle = lit>0.05
        ? `rgba(255,${Math.floor(80-lit*40)},${Math.floor(90-lit*30)},${0.05+lit*0.35})`
        : `rgba(40,60,75,${0.05+intensity*0.06})`;
      cx.beginPath();cx.moveTo(n1.x,n1.y);cx.lineTo(n2.x,n2.y);cx.stroke();
    }
    for(let i=pulses.length-1;i>=0;i--){
      const p=pulses[i]; p.t+=p.spd;
      const x=p.fx+(p.tx-p.fx)*p.t, y=p.fy+(p.ty-p.fy)*p.t;
      cx.fillStyle="rgba(255,70,90,.9)";
      cx.beginPath();cx.arc(x,y,1.8,0,7);cx.fill();
      if(p.t>=1){ if(nodes[p.idx]){nodes[p.idx].a=1; if(Math.random()<.5) spread_from(nodes[p.idx], 1);} pulses.splice(i,1); }
    }
    for(const n of nodes){
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1; if(n.y<0||n.y>H)n.vy*=-1;
      n.a*=0.97;
      const glow=n.base+n.a;
      if(n.a>0.04){
        cx.fillStyle=`rgba(255,${Math.floor(60+ (1-n.a)*120)},75,${Math.min(1,n.a)})`;
        cx.beginPath();cx.arc(n.x,n.y,1.6+n.a*2.6,0,7);cx.fill();
        cx.fillStyle=`rgba(255,70,90,${n.a*0.12})`;
        cx.beginPath();cx.arc(n.x,n.y,8+n.a*14,0,7);cx.fill();
      }else{
        cx.fillStyle=`rgba(120,180,190,${glow})`;
        cx.beginPath();cx.arc(n.x,n.y,1.3,0,7);cx.fill();
      }
    }
    requestAnimationFrame(loop);
  }

  /* ---------- metric animation ---------- */
  function tween(el,from,to,suffix,dur){
    const t0=performance.now();
    function step(t){
      const k=Math.min(1,(t-t0)/dur);
      const v=Math.floor(from+(to-from)*(1-(1-k)*(1-k)));
      el.textContent=v.toLocaleString("en-US")+(suffix||"");
      if(k<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function syncMetrics(prev){
    const fall=100-state.favor, pfall=100-prev.favor;
    tween($("#m-favor"),pfall,fall,"",700);
    tween($("#m-spread"),prev.spread,state.spread,"",900);
    tween($("#m-panic"),prev.panic,state.panic,"",700);
    $("#bar-favor").style.width=fall+"%";
    $("#bar-favor").style.background = fall<45?"var(--cyan)":fall<70?"var(--amber)":"var(--red)";
    $("#bar-panic").style.width=Math.min(100,state.panic)+"%";
  }
  function applyMetricsDisplay(from, to){
    tween($("#m-favor"),100-from.favor,100-to.favor,"",700);
    tween($("#m-spread"),from.spread,to.spread,"",900);
    tween($("#m-panic"),from.panic,to.panic,"",700);
    const ft=100-to.favor;
    $("#bar-favor").style.width=ft+"%";
    $("#bar-favor").style.background = ft<45?"var(--cyan)":ft<70?"var(--amber)":"var(--red)";
    $("#bar-panic").style.width=Math.min(100,to.panic)+"%";
  }

  /* ---------- screens ---------- */
  function showIntro(){
    const t=T();
    screen="intro";
    stageState={type:"standby"};
    $("#dock").style.display="none";
    $("#t-stage").textContent=stageText();
    const brief = t.briefK.map((k,i)=>
      '<div class="row"'+(i>0?' style="margin-top:8px"':'')+'><span class="k">'+k+'</span><span class="v"'+(i===3?' style="color:var(--muted)"':'')+'>'+t.briefV[i]+"</span></div>").join("");
    $("#stage").innerHTML=`
      <div class="card">
        <div class="eyebrow">${t.introEyebrow}</div>
        <h1>${t.introTitle}</h1>
        <p class="sub">${t.introSub}</p>
        <div class="brief">${brief}</div>
        <button class="btn" id="start">${t.start} <span class="arr">→</span></button>
      </div>`;
    $("#start").onclick=()=>{ reset(); $("#dock").style.display="flex"; syncMetrics(state); showRound(); };
  }

  const H_VALUES = [           // per-round harm level of each option (index-aligned with opts)
    [1,2,3],
    [1,2,3],
    [1,3,4]
  ];

  function showRound(){
    const t=T();
    const r=t.rounds[ri];
    if(screen!=="round") SFX.whoosh();
    screen="round";
    stageState={type:"round", ri:ri};
    $("#t-stage").textContent=stageText();
    const optHtml=r.opts.map((o,i)=>`
      <button class="opt" data-h="${H_VALUES[ri][i]}" data-i="${i}">
        <span class="tag">${o.tag}</span><span>${o.txt}</span>
      </button>`).join("");
    $("#stage").innerHTML=`
      <div class="card">
        <div class="roundtag">${t.roundWord} <b>${ri+1}</b> / ${t.rounds.length} &nbsp;·&nbsp; ${r.tag}</div>
        <div class="prompt">${r.prompt}</div>
        <div class="technique">${r.tech}</div>
        <div class="opts">${optHtml}</div>
      </div>`;
    document.querySelectorAll(".opt").forEach(btn=>{
      btn.onclick=()=>choose(parseInt(btn.dataset.h,10), btn);
    });
  }

  const LOCKED = {1:0.30, 2:0.45, 3:0.62, 4:0.74};

  function choose(h, btn){
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("disabled"));
    btn.classList.remove("disabled"); btn.classList.add("picked");
    SFX.select(h);
    ignite(h);
    const rawSpread = Math.floor(h*h*(900+Math.random()*1600));
    const rawPanic  = h*h + h*4;
    const rawFav    = h*h*3 + h*5;
    const lock = LOCKED[h];
    const effSpread = Math.round(rawSpread*lock);
    const effPanic  = Math.round(rawPanic*lock);
    const effFav    = Math.round(rawFav*lock);
    const prev={...state};
    resultCtx = {
      h, lock, effSpread, effPanic, effFav,
      blocked: rawSpread-effSpread,
      prev,
      peak:{favor:Math.max(0,prev.favor-rawFav), spread:prev.spread+rawSpread, panic:Math.min(100,prev.panic+rawPanic)},
      finalS:{favor:Math.max(0,prev.favor-effFav), spread:prev.spread+effSpread, panic:Math.min(100,prev.panic+effPanic)},
      applied:false, backfired:false, bf:null
    };
    setTimeout(()=>runResult(resultCtx, false), 480);
  }

  function runResult(ctx, instant){
    const t=T();
    const last = ri===t.rounds.length-1;
    const {h, lock, effSpread, effPanic, effFav, blocked, prev, peak, finalS} = ctx;
    screen="result";

    $("#stage").innerHTML=`
      <div class="card result">
        <div class="roundtag">${t.roundWord} ${ri+1} / ${t.rounds.length} &nbsp;·&nbsp; ${t.resultTag}</div>
        <p class="resline">${t.resultLines[h]}</p>
        <div class="chart">
          <svg id="curve" viewBox="0 0 300 96" preserveAspectRatio="none" aria-hidden="true">
            <line class="axis" x1="0" y1="92" x2="300" y2="92"></line>
            <line x1="165" y1="6" x2="165" y2="92" class="checkline"></line>
            <polyline id="cline" points=""></polyline>
            <circle id="chead" r="3" cx="0" cy="92"></circle>
          </svg>
          <div class="chartlabels">
            <span id="ctimer" class="ctimer">${t.checkTimer}<b>30</b>s</span>
            <span id="cdone" class="cdone">${t.checkDone}</span>
          </div>
        </div>
        <div class="deltas" id="deltas" style="opacity:0">
          <div><span class="dl">${t.dSpread}</span><span class="dv">+${effSpread.toLocaleString("en-US")}</span></div>
          <div><span class="dl block"><b>${t.dBlock}</b></span><span class="dv block">−${blocked.toLocaleString("en-US")}</span></div>
          <div><span class="dl">${t.dPanic}</span><span class="dv">+${effPanic}</span></div>
          <div><span class="dl">${t.dFavor}</span><span class="dv">+${effFav}%</span></div>
        </div>
        <p class="checkline-note" id="cnote" style="opacity:0">${t.checkLines[h]}</p>
        <button class="btn" id="next" style="opacity:0;pointer-events:none">${last?t.seeReveal:t.next} <span class="arr">→</span></button>
      </div>`;

    const line=$("#cline"), head=$("#chead"), timerB=$("#ctimer b"),
          timerWrap=$("#ctimer"), done=$("#cdone");
    const CW=300, baseY=92;
    const peakH = 16 + lock*62;
    const peakY = baseY - peakH;
    const resY  = baseY - peakH*lock*0.9;
    const pc = 165/CW;
    let pts=[], checked=false, settled=false, lastSec=31;

    function yAt(p){
      if(p<pc){ const k=p/pc; return baseY-peakH*(1-(1-k)*(1-k)); }
      if(p<pc+0.10){ const k=(p-pc)/0.10; return peakY+(resY-peakY)*k; }
      return resY;
    }
    function markChecked(animateMetrics){
      if(checked) return;
      checked=true;
      timerWrap.style.display="none";
      done.classList.add("show");
      if(animateMetrics){ applyMetricsDisplay(peak, finalS); SFX.factcheck(); }
    }
    function finish(){
      if(settled)return; settled=true;
      if(!ctx.applied){ state={...finalS}; ctx.applied=true; }
      markChecked(false);
      const dq=$("#deltas"); dq.style.transition="opacity .4s"; dq.style.opacity="1";
      const cn=$("#cnote"); cn.style.transition="opacity .4s .12s"; cn.style.opacity="1";
      const nx=$("#next");
      const enableNext=()=>{
        nx.style.transition="opacity .4s"; nx.style.opacity="1"; nx.style.pointerEvents="auto";
        nx.onclick=()=>{ ri++; if(ri<t.rounds.length) showRound(); else endGame(); };
        if(!instant) nx.focus();
      };
      if(h===4) setTimeout(()=>backfire(enableNext), instant?0:950);
      else enableNext();
    }
    function backfire(then){
      const claw=18;
      if(!ctx.bf){
        ctx.bf={ favor:Math.min(100, finalS.favor+claw),
                 spread:Math.max(0, finalS.spread-Math.round(effSpread*0.4)),
                 panic:Math.max(0, finalS.panic-4) };
      }
      if(!ctx.backfired){
        applyMetricsDisplay(finalS, ctx.bf);
        state={...ctx.bf};
        ctx.backfired=true;
        SFX.alarm();
      }
      const box=document.createElement("div");
      box.className="backfire";
      box.innerHTML='<div class="bf-h">'+t.bfTitle+'</div>'+
        '<p>'+t.bfText+'</p>'+
        '<div class="bf-row"><span>'+t.bfRow+'</span><b>+'+claw+'%</b></div>';
      const card=document.querySelector(".result");
      card.insertBefore(box, $("#next"));
      if(instant) box.classList.add("show");
      else requestAnimationFrame(()=>box.classList.add("show"));
      setTimeout(then, instant?0:650);
    }

    if(instant){
      // language switched mid-result: redraw everything in its settled form
      for(let p=0;p<=1.0001;p+=0.01){
        const px=Math.min(1,p);
        pts.push((px*CW).toFixed(1)+","+yAt(px).toFixed(1));
      }
      line.setAttribute("points", pts.join(" "));
      head.setAttribute("cx", String(CW)); head.setAttribute("cy", yAt(1).toFixed(1));
      finish();
      return;
    }

    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DUR = reduce?700:3000;
    const start=performance.now();
    applyMetricsDisplay(prev, peak);

    function frame(tm){
      const p=Math.min(1,(tm-start)/DUR);
      const x=p*CW;
      const y=yAt(p);
      if(p<pc){
        const sec=Math.max(0,Math.ceil(30*(1-p/pc)));
        if(sec!==lastSec){ lastSec=sec; if(sec<30 && sec%3===0) SFX.timerTick(sec); }
        timerB.textContent=sec;
      }
      else markChecked(true);
      pts.push(x.toFixed(1)+","+y.toFixed(1));
      line.setAttribute("points", pts.join(" "));
      head.setAttribute("cx", x.toFixed(1)); head.setAttribute("cy", y.toFixed(1));
      if(p<1) requestAnimationFrame(frame); else finish();
    }
    requestAnimationFrame(frame);
  }

  function endGame(){
    endWon = state.favor<=30;
    if(endWon) SFX.win(); else SFX.lose();
    screen="success";
    stageState={type:"done"};
    $("#dock").style.display="none";
    $("#t-stage").textContent=stageText();
    renderEnd();
    $("#screen-success").classList.add("show");
  }
  function renderEnd(){
    const t=T();
    if(endWon){
      $("#win-stamp").textContent="▌ MISSION COMPLETE";
      $("#win-stamp").style.color="var(--red)";
      $("#win-title").textContent=t.winTitleOk;
      $("#win-line").textContent=t.winLineOk(state.favor, state.panic);
    }else{
      $("#win-stamp").textContent="▌ MISSION FAILED";
      $("#win-stamp").style.color="var(--muted)";
      $("#win-title").textContent=t.winTitleFail;
      $("#win-line").textContent=t.winLineFail(state.favor);
    }
  }

  function showReveal(){
    SFX.reveal();
    screen="reveal";
    $("#screen-success").classList.remove("show");
    $("#screen-reveal").classList.add("show");
    const node=$("#screen-reveal .reveal-stagger");
    node.querySelectorAll("*").forEach(el=>{ el.style.animation="none"; void el.offsetWidth; el.style.animation=""; });
  }

  /* ---------- wire ---------- */
  function toast(msg){ const el=$("#toast"); if(!el)return; el.textContent=msg; el.classList.add("show"); clearTimeout(el._h); el._h=setTimeout(()=>el.classList.remove("show"),2200); }

  async function copyText(txt){
    try{ await navigator.clipboard.writeText(txt); return true; }
    catch(e){
      try{
        const ta=document.createElement("textarea");
        ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        const ok=document.execCommand("copy"); ta.remove(); return ok;
      }catch(e2){ return false; }
    }
  }

  /* UI 音效(事件委派) */
  let hoverLast=null;
  document.addEventListener("click",e=>{
    if(e.target.closest("#mutebtn")||e.target.closest(".opt")) return; // 各自有音效
    if(e.target.closest(".btn,.linklike,.langbtn")) SFX.click();
  });
  document.addEventListener("mouseover",e=>{
    const o=e.target.closest(".opt,.btn");
    if(o && !o.classList.contains("disabled")){ if(o!==hoverLast){ hoverLast=o; SFX.tick(); } }
    else hoverLast=null;
  });

  const muteBtn=$("#mutebtn");
  const updMute=()=>{ muteBtn.textContent = SFX.muted ? "♪ OFF" : "♪ ON"; muteBtn.style.opacity = SFX.muted ? ".55" : "1"; };
  muteBtn.onclick=()=>{ SFX.ensure(); SFX.toggle(); updMute(); if(!SFX.muted) SFX.click(); };
  updMute();

  $("#langbtn").onclick=()=>setLang(lang==="zh"?"en":"zh");
  $("#to-reveal").onclick=showReveal;
  $("#share").onclick=async()=>{
    const t=T();
    const url=SHARE_URL||location.href;
    const data={title:t.shareTitle, text:t.shareText, url};
    if(navigator.share){
      try{ await navigator.share(data); return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
    const ok=await copyText(data.text+" "+url);
    toast(ok?t.toastCopied:t.toastCopyFail);
  };
  const restart=()=>{ $("#screen-reveal").classList.remove("show"); $("#win-stamp").style.color="var(--red)"; showIntro(); };
  $("#restart").onclick=restart;
  $("#restart").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); restart(); } });

  addEventListener("resize",resize);
  reset(); applyChrome(); resize(); loop(); showIntro();
})();
</script>
</body>
</html>
